<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Net Command Post</title>
<style>
:root {
  --bg: #0b0d10; --panel: #14181d; --line: #2c333c; --fg: #f4f6f8; --muted: #a9b2bc; --badge-fg: #0b0d10;
  --ok: #22c55e; --warn: #f5a524; --off: #59626d; --bad: #ef4444; --info: #4da3ff;
  --sos: #ff4d4d;    --sos-bg: #3b1013;
  --person: #ffb020; --person-bg: #33270a;
  --phone: #4da3ff;  --phone-bg: #0d2440;
  --heat: #ff7a1a;   --heat-bg: #3a1e08;
  --hazard: #c084fc; --hazard-bg: #2b1340;
  --other: #9ca3af;  --other-bg: #1f2329;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0f3; --panel: #ffffff; --line: #cdd3da; --fg: #0b0d10; --muted: #4b5563; --badge-fg: #ffffff;
  --ok: #16a34a; --warn: #d97706; --off: #9aa3ad; --bad: #dc2626; --info: #1d6fd8;
  --sos: #d90429;    --sos-bg: #ffe3e6;
  --person: #b45309; --person-bg: #fff1d6;
  --phone: #1d6fd8;  --phone-bg: #e2efff;
  --heat: #c2410c;   --heat-bg: #ffe6d5;
  --hazard: #7e22ce; --hazard-bg: #f1e4ff;
  --other: #6b7280;  --other-bg: #eef0f2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 20px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column;
}
button {
  font: inherit; font-size: 18px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--fg); background: transparent; color: var(--fg);
}
button:hover { background: var(--fg); color: var(--bg); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; flex: 0 0 auto;
  min-height: 60px; padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line);
}
h1 { font-size: 24px; margin: 0; white-space: nowrap; flex: 0 0 auto; }
h1 span { color: var(--muted); font-weight: 600; }
#counts { display: flex; gap: 5px; flex-wrap: nowrap; flex: 0 0 auto; }
.count { padding: 4px 9px; border-radius: 999px; background: var(--c); color: var(--badge-fg); font-weight: 700; font-size: 14px; white-space: nowrap; }
.count.zero { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
.spacer { flex: 1; }
header .spacer { min-width: 0; }
header button { flex: 0 0 auto; font-size: 14px; padding: 6px 10px; white-space: nowrap; }
#link { min-width: 0; max-width: 300px; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto;
        font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
#link.good { color: var(--ok); } #link.bad { color: var(--bad); } #link.info { color: var(--info); }
#sound.off { border-color: var(--warn); color: var(--warn); }
#clock { flex: 0 0 auto; font-size: 25px; line-height: 1; white-space: nowrap; font-weight: 800; font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);
       grid-template-rows: minmax(0, 1fr) auto; gap: 12px; padding: 12px; }
section.plan { grid-column: 1; grid-row: 1; }
section.live { grid-column: 1; grid-row: 2; padding: 10px 14px; }
section.side { grid-column: 2; grid-row: 1 / span 2; }
section.plan, section.live { overflow: hidden; }
section.plan h2 { display: flex; gap: 12px; align-items: baseline; flex: 0 0 auto; white-space: nowrap; }
#plan-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; }
#planwrap { min-width: 0; min-height: 0; position: relative; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; background: #0d1014; border-radius: 8px; cursor: grab; touch-action: none; }
#plan-tools { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;
              font-size: 12px; color: var(--muted); }
#plan-tools button { flex: 0 0 auto; font-size: 12px; line-height: 1.2; padding: 5px 8px; border-width: 1px; border-radius: 5px; }
#plan-tools #plan-reset { margin-left: 4px; color: var(--muted); border-color: var(--line); }
#plan-tools button.active { border-color: var(--info); color: var(--info); }
#plan-tools .plan-hint { margin-left: auto; font-size: 11px; }
#plan-people { min-width: 0; min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); padding-left: 10px; }
#plan-people h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
#plan-person-list { display: flex; flex-direction: column; gap: 5px; }
.plan-person { display: block; flex: 0 0 auto; width: 100%; padding: 5px 7px; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--person); border-radius: 5px; font-size: 11px; line-height: 1.4; font-weight: 400; }
.plan-person strong, .plan-person span { display: block; }
.plan-person strong { font-size: 12px; }
.plan-person span { color: var(--muted); }
.plan-person.down { border-left-color: var(--sos); }
.plan-person.old { opacity: .5; }
.plan-person.selected, .plan-person:hover { opacity: 1; border-color: var(--info); background: var(--bg); color: var(--fg); }
#plan-person-empty { margin: 6px 0; font-size: 12px; color: var(--muted); }
#plan-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.side #map { max-height: 150px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-height: 0; display: flex; flex-direction: column; }
h2 { margin: 0 0 10px; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* floor plan */
#map { width: 100%; height: auto; display: block; }
.wall { fill: none; stroke: var(--muted); stroke-width: 5; }
.zone { fill: var(--muted); font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.link { stroke: var(--muted); stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; opacity: .6; }
.node .dot { stroke: var(--panel); stroke-width: 5; transition: fill .4s; }
.node.green .dot { fill: var(--ok); } .node.amber .dot { fill: var(--warn); } .node.grey .dot { fill: var(--off); }
.node .id { font-size: 26px; font-weight: 800; fill: #0b0d10; text-anchor: middle; dominant-baseline: central; }
.node .id.long { font-size: 20px; }
.node.grey .id { fill: #ffffff; }
.node .label { font-size: 28px; font-weight: 700; fill: var(--fg); text-anchor: middle; }
.node .age { font-size: 22px; fill: var(--muted); text-anchor: middle; }
.node .ring { fill: none; stroke: var(--fg); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.hl .ring { animation: ring 1s ease-out infinite; }
@keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.arc { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 18 12; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; font-size: 18px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }
#others, #stats { margin-top: 10px; font-size: 18px; color: var(--muted); }

/* alert feed */
#feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
#empty { color: var(--muted); padding: 24px 4px; }
.card { --c: var(--other); --cbg: var(--other-bg); border-left: 12px solid var(--c); background: var(--cbg); border-radius: 10px; padding: 12px 16px; }
.sos { --c: var(--sos); --cbg: var(--sos-bg); }
.person { --c: var(--person); --cbg: var(--person-bg); }
.phone { --c: var(--phone); --cbg: var(--phone-bg); }
.heat { --c: var(--heat); --cbg: var(--heat-bg); }
.hazard { --c: var(--hazard); --cbg: var(--hazard-bg); }
.card .top { display: flex; align-items: center; gap: 12px; }
.badge { background: var(--c); color: var(--badge-fg); font-weight: 800; font-size: 18px; letter-spacing: .05em; padding: 2px 10px; border-radius: 6px; }
.card .zone-t { font-weight: 700; }
.card .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.card .main { font-size: 28px; font-weight: 750; margin: 6px 0 2px; overflow-wrap: anywhere; }
.card.sos .main { font-size: 38px; }
.card .details { font-size: 21px; }
.card .yes { color: var(--ok); font-weight: 800; }
.card .no { color: var(--warn); font-weight: 800; }
.card .meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 18px; }
.card .route { font-family: ui-monospace, Menlo, Consolas, monospace; flex: 1; }
.card.handled { opacity: .45; filter: grayscale(1); }
.card.acked { opacity: .8; filter: none; }
.card.person.down { --c: var(--sos); }
.card .bad-t { color: var(--sos); font-weight: 800; }
.card .near { color: var(--sos); font-weight: 800; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: .35; } }
.card .reps { font-weight: 700; }
.card .acked-t { color: var(--ok); font-weight: 800; }
button.reply { border-color: var(--ok); color: var(--ok); }
button.reply:hover { background: var(--ok); color: var(--bg); }
.card.fresh { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { box-shadow: 0 0 0 5px var(--c); } }


/* spotter live view (bulk link through the relay mesh) */
section.side { overflow-y: auto; }
#remote { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
#remote figure { margin: 0; min-width: 0; }
#remote img, #remote canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 8px; aspect-ratio: 4 / 3; object-fit: contain; max-height: none; }
#view3d { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden; }
#remote figcaption { height: 2.7em; overflow: hidden; font-size: 13px; line-height: 1.35; color: var(--muted); margin-top: 5px; overflow-wrap: anywhere; }
#view3d button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px #72c7ff; }
#remote figcaption.stale { color: var(--warn); }
h2.sub-h { margin-top: 18px; }
h2 small { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 15px; }
#rstats { font-size: 12px; line-height: 1.35; color: var(--muted); margin-top: 6px; }

@media (max-width: 1500px) {
  header { gap: 9px; }
  h1 { font-size: 20px; }
  .count { font-size: 12px; padding: 4px 7px; }
  header button, #link { font-size: 12px; }
  #clock { font-size: 23px; }
  section { padding: 12px 14px; }
  h2 { font-size: 20px; }
  #plan-body { grid-template-columns: minmax(0, 1fr) 160px; }
  #plan-tools .plan-hint { display: none; }
}

@media (max-width: 1000px) {
  header { flex-wrap: wrap; }
  h1 span { display: none; }
  #counts { order: 1; flex: 1 0 100%; justify-content: space-between; }
  main { grid-template-columns: 1fr; grid-template-rows: auto; }
  section.plan, section.live, section.side { grid-column: 1; grid-row: auto; }
  #planwrap { min-height: 60vh; }
  #feed { overflow: visible; }
  body { height: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Rescue Net <span>· Command Post</span></h1>
  <div id="counts" title="Unhandled alerts by type"></div>
  <div class="spacer"></div>
  <div id="link" class="bad">Connecting…</div>
  <button id="sound" class="off" title="Browsers only allow sound after a click">Enable sound</button>
  <button id="theme">Light</button>
  <div id="clock">--:--:--</div>
</header>
<main>
  <section class="plan">
    <h2>Floor plan <small id="plan-t">waiting for LiDAR</small></h2>
    <div id="plan-tools" aria-label="Floor plan controls">
      <button id="plan-fit" class="active" title="Return to automatic map fitting">Fit</button>
      <button id="plan-labels" class="active" aria-pressed="true" title="Show or hide small marker labels">Labels</button>
      <button id="plan-raw" class="active" aria-pressed="true" title="Show the raw LiDAR scan and occupancy map">Raw scan</button>
      <span>Mark relay:</span>
      <button data-node="B2" title="Mark B2 at SP1's position">B2 here</button><button data-node="B1" title="Mark B1 at SP1's position">B1 here</button><button data-node="BASE" title="Mark BASE at SP1's position">BASE here</button>
      <button id="plan-reset" title="Start a new map and clear relay positions">Reset map</button>
      <span class="plan-hint">Scroll to zoom · drag to pan</span>
    </div>
    <div id="plan-body">
      <div id="planwrap"><canvas id="plan" aria-label="Floor plan; scroll to zoom, drag empty space to pan or a relay to move it"></canvas></div>
      <aside id="plan-people" aria-label="People on the floor plan">
        <h3>People <span id="plan-person-count"></span></h3>
        <div id="plan-person-list"></div>
        <p id="plan-person-empty">No sightings</p>
      </aside>
    </div>
  </section>
  <section class="live">
    <div id="remote">
      <figure><img id="rcam" alt="SP1 camera"><figcaption id="rcam-t">Camera: waiting for the first frame</figcaption></figure>
      <figure><img id="rthermal" alt="SP1 thermal camera"><figcaption id="rthermal-t">Thermal: waiting</figcaption></figure>
      <figure id="fig3d"><div id="view3d" hidden></div><canvas id="rlidar" width="400" height="300"></canvas><figcaption id="rlidar-t">LiDAR: waiting</figcaption></figure>
    </div>
    <div id="rstats"></div>
  </section>
  <section class="side">
    <h2>Relay chain</h2>
    <svg id="map" viewBox="0 0 1000 180" role="img" aria-label="Relay chain with radio node ids and last heard status"></svg>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>heard &lt; 30 s ago</span>
      <span><i style="background:var(--warn)"></i>&lt; 60 s</span>
      <span><i style="background:var(--off)"></i>silent</span>
    </div>
    <div id="others"></div>
    <div id="stats"></div>
    <h2 class="sub-h">Alerts</h2>
    <div id="feed"><div id="empty">No alerts yet. Heartbeats keep the relay chain up to date.</div></div>
  </section>
</main>
<script>
"use strict";

const NODES = [{ id: "SP1" }, { id: "B2" }, { id: "B1" }, { id: "BASE" }];
const TYPE_ORDER = ["SOS", "PERSON", "PHONE", "HEAT", "HAZARD"];
const TYPE_CLASS = { SOS: "sos", PERSON: "person", PHONE: "phone", HEAT: "heat", HAZARD: "hazard" };
const VIEW = { L: "left of view", C: "centre of view", R: "right of view" };
const SHOWN_KEYS = new Set(["id", "src", "ttl", "rt", "t", "z", "key", "rx", "handled", "msg", "_rssi",
                            "q", "p", "inj", "nr", "ps", "reps", "first", "acked", "ack_msg"]);
const INJURY = { 0: "no one hurt", 1: "hurt, can move", 2: "TRAPPED / can't move" };
const HIGHLIGHT_MS = 3000;
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;          // always textContent: SOS text comes from strangers
  return e;
}
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const fmtTime = (epoch) => new Date(epoch * 1000).toLocaleTimeString([], { hour12: false });
function ago(s) {
  s = Math.max(0, Math.round(s));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
}

// ---------- floor plan ----------
const NX = (i) => 100 + i * (800 / (NODES.length - 1)), NY = 65;
const nodeEls = {};

function buildMap() {
  const map = $("map");
  for (let i = 0; i < NODES.length - 1; i++) {
    map.appendChild(svg("line", { class: "link", x1: NX(i), y1: NY, x2: NX(i + 1), y2: NY }));
  }
  map.appendChild(svg("g", { id: "arcs" }));
  NODES.forEach((n, i) => {
    const g = svg("g", { class: "node grey" });
    g.appendChild(svg("circle", { class: "ring", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("circle", { class: "dot", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("text", { class: n.id.length > 3 ? "id long" : "id", x: NX(i), y: NY }, n.id));
    const age = svg("text", { class: "age", x: NX(i), y: NY + 76 }, "never heard");
    g.appendChild(age);
    map.appendChild(g);
    nodeEls[n.id] = { g, age, i, until: 0 };
  });
}

function renderNodes(nodes) {
  const now = Date.now();
  for (const n of NODES) {
    const info = nodes[n.id] || {}, e = nodeEls[n.id];
    e.g.setAttribute("class", `node ${info.health || "grey"}${e.until > now ? " hl" : ""}`);
    e.age.textContent = info.age == null ? "never heard" : `heard ${ago(info.age)}`;
  }
  const others = Object.keys(nodes).filter((id) => !nodeEls[id]);
  $("others").textContent = others.length
    ? "Other nodes: " + others.map((id) => `${id} (${nodes[id].health})`).join(", ") : "";
}

// Pulse the nodes on the alert's path and draw arcs hop by hop (a skipped node shows as a bigger jump).
function highlightRoute(a) {
  const path = [a.src, ...(Array.isArray(a.rt) ? a.rt : [])];
  if (path[path.length - 1] !== "BASE") path.push("BASE");
  const hops = path.filter((id) => nodeEls[id]);
  const until = Date.now() + HIGHLIGHT_MS;
  for (const id of hops) { nodeEls[id].until = until; nodeEls[id].g.classList.add("hl"); }
  setTimeout(() => {
    for (const id of hops) if (nodeEls[id].until <= Date.now()) nodeEls[id].g.classList.remove("hl");
  }, HIGHLIGHT_MS + 50);
  for (let k = 0; k < hops.length - 1; k++) {
    const i1 = nodeEls[hops[k]].i, i2 = nodeEls[hops[k + 1]].i;
    if (i1 === i2) continue;
    const x1 = NX(i1), x2 = NX(i2), y = NY - 44, lift = Math.min(16, 8 + 3 * (Math.abs(i2 - i1) - 1));
    const p = svg("path", { class: "arc", d: `M${x1} ${y} Q${(x1 + x2) / 2} ${y - 2 * lift} ${x2} ${y}` });
    p.style.stroke = `var(--${TYPE_CLASS[a.t] || "other"})`;
    $("arcs").appendChild(p);
    setTimeout(() => p.remove(), HIGHLIGHT_MS);
  }
}

// ---------- alert cards ----------
const deg = (dt) => (dt == null ? null : `${dt >= 0 ? "+" : ""}${dt} °C`);
const zone = (a) => (a.z ? `zone ${a.z}` : null);
function extras(a) {
  return Object.entries(a).filter(([k]) => !SHOWN_KEYS.has(k))
    .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`);
}

function describe(a) {
  switch (a.t) {
    case "SOS":
      return {
        main: a.msg ? `“${a.msg}”` : "SOS (no message)",
        details: [a.p != null ? (a.p >= 4 ? "4 or more people" : `${a.p} ${a.p === 1 ? "person" : "people"}`) : null,
                  a.inj != null ? el("span", a.inj > 0 ? "bad-t" : null, INJURY[a.inj] || `injury ${a.inj}`) : null,
                  a.src === "B1" ? "sent from the rescue Wi-Fi at B1" : null],
      };
    case "PERSON":
      return {
        main: `${a.ps === "D" ? "Person on the ground" : "Person detected"}${a.c != null ? ` · ${a.c}%` : ""}`,
        details: [a.ps === "D" ? el("span", "bad-t", "lying down, possible casualty") : a.ps === "U" ? "upright" : null,
                  a.th === 1 ? el("span", "yes", "thermal confirmed") : a.th === 0 ? el("span", "no", "thermal not confirmed") : null,
                  a.th != null ? deg(a.dt) : null, VIEW[a.v]],
      };
    case "PHONE": {
      const where = a.z || a.src;
      return {
        main: a.n != null ? `${a.n} device${a.n === 1 ? "" : "s"} near ${where}` : `Phones heard near ${where}`,
        details: [a.nr > 0 ? el("span", "near", `${a.nr === 1 ? "A phone is" : `${a.nr} phones are`} right next to ${where}`) : null,
                  a.rssi != null ? `strongest ${a.rssi} dBm` : null, a.ap != null ? `${a.ap} Apple` : null],
      };
    }
    case "HEAT":
      return {
        main: "Warm spot, no person seen",
        details: [deg(a.dt), VIEW[a.v], a.c != null ? `${a.c}% confidence` : null],
      };
    case "HAZARD":
      return { main: a.msg || "Hazard reported", details: extras(a) };
    case "MARK":
      return {
        main: `${a.z || a.src} position marked`,
        details: [a.slam ? `x ${a.mx} m, y ${a.my} m on the floor plan` : "no SLAM map yet: placed at the start point",
                  "button on the node, SP1 held next to it"],
      };
    default:
      return { main: `${a.t || "Unknown"} message${a.msg ? `: ${a.msg}` : ""}`, details: extras(a) };
  }
}

function buildCard(a, fresh) {
  const card = el("article", `card ${TYPE_CLASS[a.t] || "other"}${a.ps === "D" ? " down" : ""}${a.handled ? " handled" : ""}${a.acked ? " acked" : ""}${fresh ? " fresh" : ""}`);
  const top = el("div", "top");
  top.appendChild(el("span", "badge", a.t || "?"));

const cards = new Map();          // alert key -> { el, handled }

  } else {
    for (const a of alerts) if (!knownKeys.has(a.key)) { knownKeys.add(a.key); fresh.push(a); }
  }
  const live = new Set();
  for (const a of alerts) {
    live.add(a.key);
    const c = cards.get(a.key);
    const sig = `${a.handled}|${a.rx}|${a.acked || ""}|${canSend}`;
    if (!c || c.sig !== sig) {
      const node = buildCard(a, fresh.includes(a));
      if (c) c.el.replaceWith(node);
      if (c && c.rx !== a.rx) highlightRoute(a);          // a repeat folded into this card
      cards.set(a.key, { el: node, sig, rx: a.rx });
    }

  for (const [k, c] of cards) if (!live.has(k)) { c.el.remove(); cards.delete(k); }

}
function renderPlanPeople(persons) {
  const sorted = [...persons].sort((a, b) => Number(freshPerson(b)) - Number(freshPerson(a)) ||
    (b.ps === "D") - (a.ps === "D") || (a.age ?? Infinity) - (b.age ?? Infinity));
  const list = $("plan-person-list"), live = new Set();
  sorted.forEach((person, index) => {
    const id = String(person.id); live.add(id);
    let row = PLAN.rows.get(id);
    if (!row) {
      row = el("button", "plan-person"); row.type = "button"; row.dataset.person = id;
      row.append(el("strong"), el("span"), el("span"));
      row.addEventListener("pointerenter", () => highlightPerson(id));
      row.addEventListener("focus", () => highlightPerson(id));
      row.addEventListener("click", () => highlightPerson(id));
      PLAN.rows.set(id, row);
    }
    row.className = `plan-person${person.ps === "D" ? " down" : ""}${freshPerson(person) ? "" : " old"}${id === PLAN.highlight ? " selected" : ""}`;
    row.children[0].textContent = `P${id} · ${person.ps === "D" ? "Down" : person.ps === "U" ? "Upright" : "Unknown"}`;
    const range = Number.isFinite(person.r) && person.r > 0 ? `${person.r.toFixed(1)} m${person.rs === "S" ? " est." : ""}` : "range unknown";
    row.children[1].textContent = `${range} · ${person.age == null ? "age unknown" : ageText(person.age)}`;
    const source = { C: "Camera", T: "Thermal", CT: "Camera + thermal" }[person.src] ||
      (person.src && person.src !== "-" ? person.src : "Source unknown");
    row.children[2].textContent = `${source}${Number.isFinite(person.x) && Number.isFinite(person.y) ? "" : " · unlocated"}`;
    if (list.children[index] !== row) list.insertBefore(row, list.children[index] || null);
  });
  for (const [id, row] of PLAN.rows) if (!live.has(id)) { row.remove(); PLAN.rows.delete(id); }

  $("plan-person-empty").hidden = persons.length > 0;
}
async function refreshPlan() {
  let d;
  try { d = await (await fetch("/api/map", { cache: "no-store" })).json(); } catch (e) { return; }
  PLAN.data = d;
  renderPlanPeople(d.persons);
  if (d.png && d.png.v !== PLAN.imgV) {
    PLAN.imgV = d.png.v;
    const img = new Image(); img.onload = () => { PLAN.img = img; drawPlan(); }; img.src = `/api/map.png?v=${d.png.v}`;
  }
  const fresh = d.persons.filter(freshPerson), people = fresh.length, down = fresh.filter((p) => p.ps === "D").length;
  const earlier = d.persons.length - people;
  const slam = d.slam ? `SLAM ${d.scans} scans${d.rejected ? `, ${d.rejected} rejected (tilt or poor match)` : ""}` : "live scan only (SLAM not loaded)";
  $("plan-t").textContent = d.scan_age == null ? "waiting for LiDAR"
    : `${slam} · ${d.hz} Hz · ${people} live ${people === 1 ? "person" : "people"}${down ? ` (${down} down)` : ""}${earlier ? ` · ${earlier} earlier` : ""}${d.scan_ok === false ? ` · last scan skipped (${d.reject_reason})` : ""}${d.slam_error ? " · " + d.slam_error : ""}`;
  $("plan-t").title = $("plan-t").textContent;
  drawPlan();
}
async function planPost(url, body) {
  try { await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); } catch (e) { /* next poll shows the truth */ }
  refreshPlan();
}
document.querySelectorAll("#plan-tools button[data-node]").forEach((b) => b.addEventListener("click", () => planPost(`/api/map/node/${b.dataset.node}`, { here: true })));
$("plan-reset").addEventListener("click", () => { if (confirm("Start a new map and clear relay positions?")) { PLAN.manualView = null; PLAN.view = null; planPost("/api/map/reset"); } });
$("plan-fit").addEventListener("click", () => { PLAN.manualView = null; PLAN.view = null; drawPlan(); });
$("plan-labels").addEventListener("click", () => {
  PLAN.labels = !PLAN.labels;
  $("plan-labels").setAttribute("aria-pressed", String(PLAN.labels));
  $("plan-labels").classList.toggle("active", PLAN.labels);
  drawPlan();
});
$("plan-raw").addEventListener("click", () => {
  if (!PLAN.data) return;
  PLAN.rawScan = !showRawPlan(PLAN.data);
  drawPlan();
});
function manualPlanView(cx, cy, scale) {
  const c = $("plan"), w = Math.max(1, c.clientWidth - 24) / scale, h = Math.max(1, c.clientHeight - 24) / scale;
  PLAN.manualView = { x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2 };
}
function planPointer(e) {
  const r = $("plan").getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function personAt(x, y) {
  if (!PLAN.data || !PLAN.toScreen) return null;
  let found = null, distance = 15;
  for (const person of PLAN.data.persons) {
    if (!Number.isFinite(person.x) || !Number.isFinite(person.y)) continue;
    const [X, Y] = PLAN.toScreen(person.x, person.y), d = Math.hypot(X - x, Y - y);
    if (d < distance) { found = String(person.id); distance = d; }
  }

}
$("plan").addEventListener("wheel", (e) => {

  const scale = Math.max(4, Math.min(1600, PLAN.scale * Math.exp(-Math.max(-300, Math.min(300, e.deltaY)) * .002)));
  manualPlanView(mx - (x - c.clientWidth / 2) / scale, my + (y - c.clientHeight / 2) / scale, scale);
  drawPlan();
}, { passive: false });
$("plan").addEventListener("pointerdown", (e) => {
  const d = PLAN.data; if (e.button !== 0 || !d || !PLAN.toScreen) return;
  const [x, y] = planPointer(e);
  PLAN.start = [x, y]; PLAN.dragMoved = false;
  $("plan").setPointerCapture(e.pointerId);
  for (const id of CHAIN) {
    const n = d.nodes[id]; if (!n) continue;
    const [X, Y] = PLAN.toScreen(n.x, n.y);
    if (Math.hypot(X - x, Y - y) < 16) { PLAN.drag = id; PLAN.dragPos = [n.x, n.y]; return; }
  }
  PLAN.pan = { center: [(PLAN.view.x0 + PLAN.view.x1) / 2, (PLAN.view.y0 + PLAN.view.y1) / 2], scale: PLAN.scale };
  $("plan").style.cursor = "grabbing";
});
$("plan").addEventListener("pointermove", (e) => {
  const [x, y] = planPointer(e);
  if (!PLAN.drag && !PLAN.pan) {
    const person = personAt(x, y);
    if (person !== PLAN.highlight) highlightPerson(person);
    return;
  }
  const dx = x - PLAN.start[0], dy = y - PLAN.start[1];
  if (Math.hypot(dx, dy) < 3 && !PLAN.dragMoved) return;
  PLAN.dragMoved = true;
  if (PLAN.drag) PLAN.dragPos = PLAN.toMap(x, y);
  else manualPlanView(PLAN.pan.center[0] - dx / PLAN.pan.scale, PLAN.pan.center[1] + dy / PLAN.pan.scale, PLAN.pan.scale);

});
function finishPlanPointer(e, cancel = false) {
  if (!PLAN.drag && !PLAN.pan) return;
  const id = PLAN.drag, position = PLAN.dragPos, moved = PLAN.dragMoved;
  PLAN.drag = null; PLAN.dragPos = null; PLAN.pan = null;
  $("plan").style.cursor = "grab";
  if ($("plan").hasPointerCapture(e.pointerId)) $("plan").releasePointerCapture(e.pointerId);
  if (!cancel && id && moved) planPost(`/api/map/node/${id}`, { x: position[0], y: position[1] });
  else if (!cancel && !moved) highlightPerson(personAt(...planPointer(e)), true);
  drawPlan();
}
$("plan").addEventListener("pointerup", (e) => finishPlanPointer(e));
$("plan").addEventListener("pointercancel", (e) => finishPlanPointer(e, true));
$("plan").addEventListener("lostpointercapture", (e) => finishPlanPointer(e, true));
if (window.ResizeObserver) new ResizeObserver(drawPlan).observe($("planwrap"));
window.addEventListener("resize", drawPlan);
refreshPlan();
setInterval(refreshPlan, 500);
</script>
