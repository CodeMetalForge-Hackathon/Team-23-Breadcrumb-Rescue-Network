<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Net Command Post</title>
<style>
:root {
  --bg: #0b0d10; --panel: #14181d; --line: #2c333c; --fg: #f4f6f8; --muted: #a9b2bc; --badge-fg: #0b0d10;
  --ok: #22c55e; --warn: #f5a524; --off: #59626d; --bad: #ef4444; --info: #4da3ff;
  --sos: #ff4d4d;    --sos-bg: #3b1013;
  --person: #ffb020; --person-bg: #33270a;
  --phone: #4da3ff;  --phone-bg: #0d2440;
  --heat: #ff7a1a;   --heat-bg: #3a1e08;
  --hazard: #c084fc; --hazard-bg: #2b1340;
  --other: #9ca3af;  --other-bg: #1f2329;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0f3; --panel: #ffffff; --line: #cdd3da; --fg: #0b0d10; --muted: #4b5563; --badge-fg: #ffffff;
  --ok: #16a34a; --warn: #d97706; --off: #9aa3ad; --bad: #dc2626; --info: #1d6fd8;
  --sos: #d90429;    --sos-bg: #ffe3e6;
  --person: #b45309; --person-bg: #fff1d6;
  --phone: #1d6fd8;  --phone-bg: #e2efff;
  --heat: #c2410c;   --heat-bg: #ffe6d5;
  --hazard: #7e22ce; --hazard-bg: #f1e4ff;
  --other: #6b7280;  --other-bg: #eef0f2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 20px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column;
}
button {
  font: inherit; font-size: 18px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--fg); background: transparent; color: var(--fg);
}
button:hover { background: var(--fg); color: var(--bg); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--line);
}
h1 { font-size: 28px; margin: 0; white-space: nowrap; }
h1 span { color: var(--muted); font-weight: 600; }
#counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { padding: 4px 12px; border-radius: 999px; background: var(--c); color: var(--badge-fg); font-weight: 700; font-size: 18px; }
.count.zero { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
.spacer { flex: 1; }
#link { font-weight: 700; font-size: 18px; padding: 6px 14px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
#link.good { color: var(--ok); } #link.bad { color: var(--bad); } #link.info { color: var(--info); }
#sound.off { border-color: var(--warn); color: var(--warn); }
#clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; padding: 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-height: 0; display: flex; flex-direction: column; }
h2 { margin: 0 0 10px; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* floor plan */
#map { width: 100%; height: auto; display: block; }
.wall { fill: none; stroke: var(--muted); stroke-width: 5; }
.zone { fill: var(--muted); font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.link { stroke: var(--muted); stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; opacity: .6; }
.node .dot { stroke: var(--panel); stroke-width: 5; transition: fill .4s; }
.node.green .dot { fill: var(--ok); } .node.amber .dot { fill: var(--warn); } .node.grey .dot { fill: var(--off); }
.node .id { font-size: 26px; font-weight: 800; fill: #0b0d10; text-anchor: middle; dominant-baseline: central; }
.node .id.long { font-size: 20px; }
.node.grey .id { fill: #ffffff; }
.node .label { font-size: 28px; font-weight: 700; fill: var(--fg); text-anchor: middle; }
.node .age { font-size: 22px; fill: var(--muted); text-anchor: middle; }
.node .ring { fill: none; stroke: var(--fg); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.hl .ring { animation: ring 1s ease-out infinite; }
@keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.arc { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 18 12; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; font-size: 18px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }
#others, #stats { margin-top: 10px; font-size: 18px; color: var(--muted); }

/* alert feed */
#feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
#empty { color: var(--muted); padding: 24px 4px; }
.card { --c: var(--other); --cbg: var(--other-bg); border-left: 12px solid var(--c); background: var(--cbg); border-radius: 10px; padding: 12px 16px; }
.sos { --c: var(--sos); --cbg: var(--sos-bg); }
.person { --c: var(--person); --cbg: var(--person-bg); }
.phone { --c: var(--phone); --cbg: var(--phone-bg); }
.heat { --c: var(--heat); --cbg: var(--heat-bg); }
.hazard { --c: var(--hazard); --cbg: var(--hazard-bg); }
.card .top { display: flex; align-items: center; gap: 12px; }
.badge { background: var(--c); color: var(--badge-fg); font-weight: 800; font-size: 18px; letter-spacing: .05em; padding: 2px 10px; border-radius: 6px; }
.card .zone-t { font-weight: 700; }
.card .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.card .main { font-size: 28px; font-weight: 750; margin: 6px 0 2px; overflow-wrap: anywhere; }
.card.sos .main { font-size: 38px; }
.card .details { font-size: 21px; }
.card .yes { color: var(--ok); font-weight: 800; }
.card .no { color: var(--warn); font-weight: 800; }
.card .meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 18px; }
.card .route { font-family: ui-monospace, Menlo, Consolas, monospace; flex: 1; }
.card.handled { opacity: .45; filter: grayscale(1); }
.card.acked { opacity: .8; filter: none; }
.card .bad-t { color: var(--sos); font-weight: 800; }
.card .near { color: var(--sos); font-weight: 800; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: .35; } }
.card .reps { font-weight: 700; }
.card .acked-t { color: var(--ok); font-weight: 800; }
button.reply { border-color: var(--ok); color: var(--ok); }
button.reply:hover { background: var(--ok); color: var(--bg); }
.card.fresh { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { box-shadow: 0 0 0 5px var(--c); } }

@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; }
  #feed { overflow: visible; }
  body { height: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Rescue Net <span>· Command Post</span></h1>
  <div id="counts" title="Unhandled alerts by type"></div>
  <div class="spacer"></div>
  <div id="link" class="bad">Connecting…</div>
  <button id="sound" class="off" title="Browsers only allow sound after a click">Enable sound</button>
  <button id="theme">Light</button>
  <div id="clock">--:--:--</div>
</header>
<main>
  <section>
    <h2>Floor plan</h2>
    <svg id="map" viewBox="0 0 1000 400" role="img" aria-label="Floor plan with radio nodes"></svg>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>heard &lt; 30 s ago</span>
      <span><i style="background:var(--warn)"></i>&lt; 60 s</span>
      <span><i style="background:var(--off)"></i>silent / never heard</span>
    </div>
    <div id="others"></div>
    <div id="stats"></div>
  </section>
  <section>
    <h2>Alerts</h2>
    <div id="feed"><div id="empty">No alerts yet. Heartbeats keep the floor plan up to date.</div></div>
  </section>
</main>
<script>
"use strict";

// Floor plan, deepest inside the building (left) to the entrance (right). Edit labels here.
const NODES = [
  { id: "SP1",  label: "Spotter" },
  { id: "B2",   label: "Hallway" },     // LoRa gateway + Bluetooth phone scan
  { id: "B1",   label: "Lobby" },       // relay + rescue Wi-Fi (survivor SOS page)
  { id: "BASE", label: "Entrance" },
];
const TYPE_ORDER = ["SOS", "PERSON", "PHONE", "HEAT", "HAZARD"];
const TYPE_CLASS = { SOS: "sos", PERSON: "person", PHONE: "phone", HEAT: "heat", HAZARD: "hazard" };
const VIEW = { L: "left of view", C: "centre of view", R: "right of view" };
const SHOWN_KEYS = new Set(["id", "src", "ttl", "rt", "t", "z", "key", "rx", "handled", "msg", "_rssi",
                            "q", "p", "inj", "nr", "reps", "first", "acked", "ack_msg"]);
const INJURY = { 0: "no one hurt", 1: "hurt, can move", 2: "TRAPPED / can't move" };
const HIGHLIGHT_MS = 3000;
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;          // always textContent: SOS text comes from strangers
  return e;
}
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const fmtTime = (epoch) => new Date(epoch * 1000).toLocaleTimeString([], { hour12: false });
function ago(s) {
  s = Math.max(0, Math.round(s));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
}

// ---------- floor plan ----------
const NX = (i) => 100 + i * (800 / (NODES.length - 1)), NY = 200;   // spotter far left, BASE outside at 900
const nodeEls = {};

function buildMap() {
  const map = $("map");
  map.appendChild(svg("path", { class: "wall", d: "M800 155 V40 H20 V360 H800 V245" }));
  map.appendChild(svg("text", { class: "zone", x: 40, y: 72 }, "BUILDING"));
  map.appendChild(svg("text", { class: "zone", x: 830, y: 72 }, "OUTSIDE"));
  for (let i = 0; i < NODES.length - 1; i++) {
    map.appendChild(svg("line", { class: "link", x1: NX(i), y1: NY, x2: NX(i + 1), y2: NY }));
  }
  map.appendChild(svg("g", { id: "arcs" }));
  NODES.forEach((n, i) => {
    const g = svg("g", { class: "node grey" });
    g.appendChild(svg("circle", { class: "ring", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("circle", { class: "dot", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("text", { class: n.id.length > 3 ? "id long" : "id", x: NX(i), y: NY }, n.id));
    g.appendChild(svg("text", { class: "label", x: NX(i), y: NY + 82 }, n.label));
    const age = svg("text", { class: "age", x: NX(i), y: NY + 114 }, "never heard");
    g.appendChild(age);
    map.appendChild(g);
    nodeEls[n.id] = { g, age, i, until: 0 };
  });
}

function renderNodes(nodes) {
  const now = Date.now();
  for (const n of NODES) {
    const info = nodes[n.id] || {}, e = nodeEls[n.id];
    e.g.setAttribute("class", `node ${info.health || "grey"}${e.until > now ? " hl" : ""}`);
    e.age.textContent = info.age == null ? "never heard" : `heard ${ago(info.age)}`;
  }
  const others = Object.keys(nodes).filter((id) => !nodeEls[id]);
  $("others").textContent = others.length
    ? "Other nodes: " + others.map((id) => `${id} (${nodes[id].health})`).join(", ") : "";
}

// Pulse the nodes on the alert's path and draw arcs hop by hop (a skipped node shows as a bigger jump).
function highlightRoute(a) {
  const path = [a.src, ...(Array.isArray(a.rt) ? a.rt : [])];
  if (path[path.length - 1] !== "BASE") path.push("BASE");
  const hops = path.filter((id) => nodeEls[id]);
  const until = Date.now() + HIGHLIGHT_MS;
  for (const id of hops) { nodeEls[id].until = until; nodeEls[id].g.classList.add("hl"); }
  setTimeout(() => {
    for (const id of hops) if (nodeEls[id].until <= Date.now()) nodeEls[id].g.classList.remove("hl");
  }, HIGHLIGHT_MS + 50);
  for (let k = 0; k < hops.length - 1; k++) {
    const i1 = nodeEls[hops[k]].i, i2 = nodeEls[hops[k + 1]].i;
    if (i1 === i2) continue;
    const x1 = NX(i1), x2 = NX(i2), y = NY - 44, lift = 45 + 45 * (Math.abs(i2 - i1) - 1);
    const p = svg("path", { class: "arc", d: `M${x1} ${y} Q${(x1 + x2) / 2} ${y - 2 * lift} ${x2} ${y}` });
    p.style.stroke = `var(--${TYPE_CLASS[a.t] || "other"})`;
    $("arcs").appendChild(p);
    setTimeout(() => p.remove(), HIGHLIGHT_MS);
  }
}

// ---------- alert cards ----------
const deg = (dt) => (dt == null ? null : `${dt >= 0 ? "+" : ""}${dt} °C`);
const zone = (a) => (a.z ? `zone ${a.z}` : null);
function extras(a) {
  return Object.entries(a).filter(([k]) => !SHOWN_KEYS.has(k))
    .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`);
}

function describe(a) {
  switch (a.t) {
    case "SOS":
      return {
        main: a.msg ? `“${a.msg}”` : "SOS (no message)",
        details: [a.p != null ? (a.p >= 4 ? "4 or more people" : `${a.p} ${a.p === 1 ? "person" : "people"}`) : null,
                  a.inj != null ? el("span", a.inj > 0 ? "bad-t" : null, INJURY[a.inj] || `injury ${a.inj}`) : null,
                  a.src === "B1" ? "sent from the rescue Wi-Fi at B1" : null],
      };
    case "PERSON":
      return {
        main: `Person detected${a.c != null ? ` · ${a.c}%` : ""}`,
        details: [a.th === 1 ? el("span", "yes", "thermal confirmed") : a.th === 0 ? el("span", "no", "thermal not confirmed") : null,
                  a.th != null ? deg(a.dt) : null, VIEW[a.v]],
      };
    case "PHONE": {
      const where = a.z || a.src;
      return {
        main: a.n != null ? `${a.n} device${a.n === 1 ? "" : "s"} near ${where}` : `Phones heard near ${where}`,
        details: [a.nr > 0 ? el("span", "near", `${a.nr === 1 ? "A phone is" : `${a.nr} phones are`} right next to ${where}`) : null,
                  a.rssi != null ? `strongest ${a.rssi} dBm` : null, a.ap != null ? `${a.ap} Apple` : null],
      };
    }
    case "HEAT":
      return {
        main: "Warm spot, no person seen",
        details: [deg(a.dt), VIEW[a.v], a.c != null ? `${a.c}% confidence` : null],
      };
    case "HAZARD":
      return { main: a.msg || "Hazard reported", details: extras(a) };
    default:
      return { main: `${a.t || "Unknown"} message${a.msg ? `: ${a.msg}` : ""}`, details: extras(a) };
  }
}

function buildCard(a, fresh) {
  const card = el("article", `card ${TYPE_CLASS[a.t] || "other"}${a.handled ? " handled" : ""}${a.acked ? " acked" : ""}${fresh ? " fresh" : ""}`);
  const top = el("div", "top");
  top.appendChild(el("span", "badge", a.t || "?"));
  if (zone(a)) top.appendChild(el("span", "zone-t", `Zone ${a.z}`));
  top.appendChild(el("span", "time", fmtTime(a.rx)));
  card.appendChild(top);

  const d = describe(a);
  card.appendChild(el("div", "main", d.main));
  const parts = d.details.filter(Boolean);
  if (parts.length) {
    const row = el("div", "details");
    parts.forEach((x, i) => {
      if (i) row.appendChild(document.createTextNode(" · "));
      row.appendChild(typeof x === "string" ? el("span", null, x) : x);
    });
    card.appendChild(row);
  }

  const meta = el("div", "meta");
  const route = [a.src, ...(Array.isArray(a.rt) ? a.rt : [])].filter(Boolean).join(" → ");
  const rssi = typeof a._rssi === "number" ? `  ·  ${a._rssi} dBm at base` : "";
  meta.appendChild(el("span", "route", `${route}${a.id ? `  ·  #${a.id}` : ""}${rssi}`));
  if (a.reps > 1) meta.appendChild(el("span", "reps", `×${a.reps} since ${fmtTime(a.first)}`));
  if (a.acked) {
    meta.appendChild(el("span", "acked-t", `Reply sent to survivor ${fmtTime(a.acked)}`));
  } else if (a.t === "SOS" && a.id && canSend) {
    const r = el("button", "reply", "Reply: help is on the way");
    r.onclick = () => sendAck(a.key, r);
    meta.appendChild(r);
  }
  if (a.acked) {
    /* reply sent = handled */
  } else if (a.handled) {
    meta.appendChild(el("span", null, "Handled"));
  } else {
    const b = el("button", null, "Mark handled");
    b.onclick = () => markHandled(a.key, b);
    meta.appendChild(b);
  }
  card.appendChild(meta);
  return card;
}

const cards = new Map();          // alert key -> { el, handled }
let knownKeys = null, lastOrder = "";

function renderFeed(alerts) {
  const fresh = [];
  if (knownKeys === null) {
    knownKeys = new Set(alerts.map((a) => a.key));       // first load: no beeps for old alerts
  } else {
    for (const a of alerts) if (!knownKeys.has(a.key)) { knownKeys.add(a.key); fresh.push(a); }
  }
  const live = new Set();
  for (const a of alerts) {
    live.add(a.key);
    const c = cards.get(a.key);
    const sig = `${a.handled}|${a.rx}|${a.acked || ""}|${canSend}`;
    if (!c || c.sig !== sig) {
      const node = buildCard(a, fresh.includes(a));
      if (c) c.el.replaceWith(node);
      if (c && c.rx !== a.rx) highlightRoute(a);          // a repeat folded into this card
      cards.set(a.key, { el: node, sig, rx: a.rx });
    }
  }
  for (const [k, c] of cards) if (!live.has(k)) { c.el.remove(); cards.delete(k); }
  const order = alerts.map((a) => a.key).join(",");
  if (order !== lastOrder) {
    lastOrder = order;
    const feed = $("feed");
    for (const a of alerts) feed.appendChild(cards.get(a.key).el);
  }
  $("empty").hidden = alerts.length > 0;

  for (const a of fresh) highlightRoute(a);
  if (fresh.some((a) => a.t === "SOS")) beep();
}

let canSend = false;
async function sendAck(key, btn) {
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const r = await fetch(`/api/ack/${encodeURIComponent(key)}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ msg: "Help is on the way" }),
    });
    if (!r.ok) { btn.disabled = false; btn.textContent = "Send failed, retry"; return; }
  } catch (e) { btn.disabled = false; btn.textContent = "Send failed, retry"; return; }
  refresh();
}

async function markHandled(key, btn) {
  btn.disabled = true;
  try { await fetch(`/api/handle/${encodeURIComponent(key)}`, { method: "POST" }); } catch (e) { /* next poll retries the view */ }
  refresh();
}

// ---------- top bar ----------
function renderCounts(alerts) {
  const counts = {};
  for (const a of alerts) if (!a.handled) counts[a.t] = (counts[a.t] || 0) + 1;
  const box = $("counts");
  box.textContent = "";
  for (const t of TYPE_ORDER) {
    const n = counts[t] || 0;
    const pill = el("span", `count ${TYPE_CLASS[t]}${n ? "" : " zero"}`, `${n} ${t}`);
    pill.style.setProperty("--c", `var(--${TYPE_CLASS[t]})`);
    box.appendChild(pill);
  }
}

function renderLink(s) {
  const p = $("link");
  if (s === null) { p.className = "bad"; p.textContent = "Dashboard server offline"; return; }
  const src = s.source || "";
  if (s.serial_connected) {
    if (src.startsWith("mock") || src.startsWith("replay")) { p.className = "info"; p.textContent = src.replace(/^./, (c) => c.toUpperCase()); }
    else if (src === "stdin") { p.className = "good"; p.textContent = "● Reading stdin"; }
    else if (src.startsWith("hub")) { p.className = "good"; p.textContent = `● Live · ${src.replace(/^hub /, "")} via board hub`; }
    else { p.className = "good"; p.textContent = `● Serial connected · ${src}`; }
  } else {
    p.className = "bad";
    p.textContent = `● Serial disconnected${src ? ` · ${src}` : ""}`;
  }
}

// ---------- sound (Web Audio, no files; browsers need one click first) ----------
let audioCtx = null;
const soundOn = () => !!audioCtx && audioCtx.state === "running";
function updateSoundBtn() {
  const b = $("sound");
  b.textContent = soundOn() ? "Sound on" : "Enable sound";
  b.classList.toggle("off", !soundOn());
}
function enableSound(test) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume().then(() => { updateSoundBtn(); if (test) beep(); });
  } catch (e) { /* no audio available */ }
}
function beep() {
  if (!soundOn()) return;
  const t0 = audioCtx.currentTime;
  [[880, 0], [660, 0.22], [880, 0.44], [660, 0.66]].forEach(([freq, dt]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + dt);
    o.stop(t0 + dt + 0.21);
  });
}
$("sound").onclick = () => enableSound(true);
document.addEventListener("pointerdown", () => enableSound(false));

// ---------- theme ----------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").textContent = t === "light" ? "Dark" : "Light";
  try { localStorage.setItem("rn-theme", t); } catch (e) { /* storage blocked */ }
}
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
try { setTheme(localStorage.getItem("rn-theme") || "dark"); } catch (e) { setTheme("dark"); }

// ---------- polling ----------
let lastOk = 0, busy = false;
function render(s) {
  canSend = !!s.can_send;
  renderLink(s);
  renderNodes(s.nodes);
  renderCounts(s.alerts);
  renderFeed(s.alerts);
  const st = s.stats || {};
  $("stats").textContent = `Messages ${st.received ?? 0} · duplicates dropped ${st.duplicates ?? 0} · non-JSON lines ignored ${st.ignored ?? 0}`;
}
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const s = await r.json();
    lastOk = Date.now();
    render(s);
  } catch (e) {
    if (Date.now() - lastOk > 3000) renderLink(null);
  } finally {
    busy = false;
  }
}
function tick() { $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); }

buildMap();
tick();
setInterval(tick, 1000);
refresh();
setInterval(refresh, 1000);
</script>
</body>
