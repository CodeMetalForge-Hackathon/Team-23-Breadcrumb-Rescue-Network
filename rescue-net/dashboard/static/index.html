<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Net Command Post</title>
<style>
:root {
  --bg: #0b0d10; --panel: #14181d; --line: #2c333c; --fg: #f4f6f8; --muted: #a9b2bc; --badge-fg: #0b0d10;
  --ok: #22c55e; --warn: #f5a524; --off: #59626d; --bad: #ef4444; --info: #4da3ff;
  --sos: #ff4d4d;    --sos-bg: #3b1013;
  --person: #ffb020; --person-bg: #33270a;
  --phone: #4da3ff;  --phone-bg: #0d2440;
  --heat: #ff7a1a;   --heat-bg: #3a1e08;
  --hazard: #c084fc; --hazard-bg: #2b1340;
  --other: #9ca3af;  --other-bg: #1f2329;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0f3; --panel: #ffffff; --line: #cdd3da; --fg: #0b0d10; --muted: #4b5563; --badge-fg: #ffffff;
  --ok: #16a34a; --warn: #d97706; --off: #9aa3ad; --bad: #dc2626; --info: #1d6fd8;
  --sos: #d90429;    --sos-bg: #ffe3e6;
  --person: #b45309; --person-bg: #fff1d6;
  --phone: #1d6fd8;  --phone-bg: #e2efff;
  --heat: #c2410c;   --heat-bg: #ffe6d5;
  --hazard: #7e22ce; --hazard-bg: #f1e4ff;
  --other: #6b7280;  --other-bg: #eef0f2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 20px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column;
}
button {
  font: inherit; font-size: 18px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--fg); background: transparent; color: var(--fg);
}
button:hover { background: var(--fg); color: var(--bg); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--line);
}
h1 { font-size: 28px; margin: 0; white-space: nowrap; }
h1 span { color: var(--muted); font-weight: 600; }
#counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { padding: 4px 12px; border-radius: 999px; background: var(--c); color: var(--badge-fg); font-weight: 700; font-size: 18px; }
.count.zero { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
.spacer { flex: 1; }
#link { font-weight: 700; font-size: 18px; padding: 6px 14px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
#link.good { color: var(--ok); } #link.bad { color: var(--bad); } #link.info { color: var(--info); }
#sound.off { border-color: var(--warn); color: var(--warn); }
#clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr);
       grid-template-rows: minmax(0, 1fr) auto; gap: 12px; padding: 12px; }
section.plan { grid-column: 1; grid-row: 1; }
section.live { grid-column: 1; grid-row: 2; padding: 10px 14px; }
section.side { grid-column: 2; grid-row: 1 / span 2; }
#planwrap { flex: 1; min-height: 260px; position: relative; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; background: #0d1014; border-radius: 8px; cursor: grab; }
#plan-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 16px; color: var(--muted); }
#plan-tools button { font-size: 15px; padding: 4px 10px; }
#plan-t { font-size: 15px; }
.side #map { max-height: 150px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-height: 0; display: flex; flex-direction: column; }
h2 { margin: 0 0 10px; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* floor plan */
#map { width: 100%; height: auto; display: block; }
.wall { fill: none; stroke: var(--muted); stroke-width: 5; }
.zone { fill: var(--muted); font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.link { stroke: var(--muted); stroke-width: 5; stroke-dasharray: 2 14; stroke-linecap: round; opacity: .6; }
.node .dot { stroke: var(--panel); stroke-width: 5; transition: fill .4s; }
.node.green .dot { fill: var(--ok); } .node.amber .dot { fill: var(--warn); } .node.grey .dot { fill: var(--off); }
.node .id { font-size: 26px; font-weight: 800; fill: #0b0d10; text-anchor: middle; dominant-baseline: central; }
.node .id.long { font-size: 20px; }
.node.grey .id { fill: #ffffff; }
.node .label { font-size: 28px; font-weight: 700; fill: var(--fg); text-anchor: middle; }
.node .age { font-size: 22px; fill: var(--muted); text-anchor: middle; }
.node .ring { fill: none; stroke: var(--fg); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.hl .ring { animation: ring 1s ease-out infinite; }
@keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.arc { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 18 12; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 8px; font-size: 18px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }
#others, #stats { margin-top: 10px; font-size: 18px; color: var(--muted); }

/* alert feed */
#feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
#empty { color: var(--muted); padding: 24px 4px; }
.card { --c: var(--other); --cbg: var(--other-bg); border-left: 12px solid var(--c); background: var(--cbg); border-radius: 10px; padding: 12px 16px; }
.sos { --c: var(--sos); --cbg: var(--sos-bg); }
.person { --c: var(--person); --cbg: var(--person-bg); }
.phone { --c: var(--phone); --cbg: var(--phone-bg); }
.heat { --c: var(--heat); --cbg: var(--heat-bg); }
.hazard { --c: var(--hazard); --cbg: var(--hazard-bg); }
.card .top { display: flex; align-items: center; gap: 12px; }
.badge { background: var(--c); color: var(--badge-fg); font-weight: 800; font-size: 18px; letter-spacing: .05em; padding: 2px 10px; border-radius: 6px; }
.card .zone-t { font-weight: 700; }
.card .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.card .main { font-size: 28px; font-weight: 750; margin: 6px 0 2px; overflow-wrap: anywhere; }
.card.sos .main { font-size: 38px; }
.card .details { font-size: 21px; }
.card .yes { color: var(--ok); font-weight: 800; }
.card .no { color: var(--warn); font-weight: 800; }
.card .meta { display: flex; align-items: center; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 18px; }
.card .route { font-family: ui-monospace, Menlo, Consolas, monospace; flex: 1; }
.card.handled { opacity: .45; filter: grayscale(1); }
.card.acked { opacity: .8; filter: none; }
.card.person.down { --c: var(--sos); }
.card .bad-t { color: var(--sos); font-weight: 800; }
.card .near { color: var(--sos); font-weight: 800; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: .35; } }
.card .reps { font-weight: 700; }
.card .acked-t { color: var(--ok); font-weight: 800; }
button.reply { border-color: var(--ok); color: var(--ok); }
button.reply:hover { background: var(--ok); color: var(--bg); }
.card.fresh { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { box-shadow: 0 0 0 5px var(--c); } }


/* spotter live view (bulk link through the relay mesh) */
section.side { overflow-y: auto; }
#remote { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
#remote figure { margin: 0; }
#remote img, #remote canvas { width: 100%; display: block; background: #000; border-radius: 8px; aspect-ratio: 4 / 3; object-fit: contain; max-height: 30vh; }
#view3d { width: 100%; aspect-ratio: 4 / 3; max-height: 30vh; background: #000; border-radius: 8px; overflow: hidden; }
#remote figcaption { font-size: 16px; color: var(--muted); margin-top: 4px; }
#remote figcaption.stale { color: var(--warn); }
h2.sub-h { margin-top: 18px; }
h2 small { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 15px; }
#rstats { font-size: 15px; color: var(--muted); margin-top: 6px; }

@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto; }
  section.plan, section.live, section.side { grid-column: 1; grid-row: auto; }
  #planwrap { min-height: 60vh; }
  #feed { overflow: visible; }
  body { height: auto; }
}
</style>
</head>
<body>
<header>
  <h1>Rescue Net <span>· Command Post</span></h1>
  <div id="counts" title="Unhandled alerts by type"></div>
  <div class="spacer"></div>
  <div id="link" class="bad">Connecting…</div>
  <button id="sound" class="off" title="Browsers only allow sound after a click">Enable sound</button>
  <button id="theme">Light</button>
  <div id="clock">--:--:--</div>
</header>
<main>
  <section class="plan">
    <h2>Floor plan <small id="plan-t">waiting for LiDAR</small></h2>
    <div id="planwrap"><canvas id="plan"></canvas></div>
    <div id="plan-tools">
      <span>Mark a relay at the spotter's position:</span>
      <button data-node="B2">B2 here</button><button data-node="B1">B1 here</button><button data-node="BASE">BASE here</button>
      <span>(or drag a relay on the map)</span>
      <span class="spacer"></span>
      <button id="plan-reset" title="Start a new map">Reset map</button>
    </div>
  </section>
  <section class="live">
    <div id="remote">
      <figure><img id="rcam" alt="Spotter camera"><figcaption id="rcam-t">Camera: waiting for the first frame</figcaption></figure>
      <figure><img id="rthermal" alt="Spotter thermal camera"><figcaption id="rthermal-t">Thermal: waiting</figcaption></figure>
      <figure id="fig3d"><div id="view3d" hidden></div><canvas id="rlidar" width="400" height="300"></canvas><figcaption id="rlidar-t">LiDAR: waiting</figcaption></figure>
    </div>
    <div id="rstats"></div>
  </section>
  <section class="side">
    <h2>Relay chain</h2>
    <svg id="map" viewBox="0 0 1000 400" role="img" aria-label="Relay chain with radio nodes"></svg>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>heard &lt; 30 s ago</span>
      <span><i style="background:var(--warn)"></i>&lt; 60 s</span>
      <span><i style="background:var(--off)"></i>silent</span>
    </div>
    <div id="others"></div>
    <div id="stats"></div>
    <h2 class="sub-h">Alerts</h2>
    <div id="feed"><div id="empty">No alerts yet. Heartbeats keep the relay chain up to date.</div></div>
  </section>
</main>
<script>
"use strict";

// Floor plan, deepest inside the building (left) to the entrance (right). Edit labels here.
const NODES = [
  { id: "SP1",  label: "Spotter" },
  { id: "B2",   label: "Hallway" },     // LoRa gateway + Bluetooth phone scan
  { id: "B1",   label: "Lobby" },       // relay + rescue Wi-Fi (survivor SOS page)
  { id: "BASE", label: "Entrance" },
];
const TYPE_ORDER = ["SOS", "PERSON", "PHONE", "HEAT", "HAZARD"];
const TYPE_CLASS = { SOS: "sos", PERSON: "person", PHONE: "phone", HEAT: "heat", HAZARD: "hazard" };
const VIEW = { L: "left of view", C: "centre of view", R: "right of view" };
const SHOWN_KEYS = new Set(["id", "src", "ttl", "rt", "t", "z", "key", "rx", "handled", "msg", "_rssi",
                            "q", "p", "inj", "nr", "ps", "reps", "first", "acked", "ack_msg"]);
const INJURY = { 0: "no one hurt", 1: "hurt, can move", 2: "TRAPPED / can't move" };
const HIGHLIGHT_MS = 3000;
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;          // always textContent: SOS text comes from strangers
  return e;
}
function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const fmtTime = (epoch) => new Date(epoch * 1000).toLocaleTimeString([], { hour12: false });
function ago(s) {
  s = Math.max(0, Math.round(s));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
}

// ---------- floor plan ----------
const NX = (i) => 100 + i * (800 / (NODES.length - 1)), NY = 200;   // spotter far left, BASE outside at 900
const nodeEls = {};

function buildMap() {
  const map = $("map");
  map.appendChild(svg("path", { class: "wall", d: "M800 155 V40 H20 V360 H800 V245" }));
  map.appendChild(svg("text", { class: "zone", x: 40, y: 72 }, "BUILDING"));
  map.appendChild(svg("text", { class: "zone", x: 830, y: 72 }, "OUTSIDE"));
  for (let i = 0; i < NODES.length - 1; i++) {
    map.appendChild(svg("line", { class: "link", x1: NX(i), y1: NY, x2: NX(i + 1), y2: NY }));
  }
  map.appendChild(svg("g", { id: "arcs" }));
  NODES.forEach((n, i) => {
    const g = svg("g", { class: "node grey" });
    g.appendChild(svg("circle", { class: "ring", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("circle", { class: "dot", cx: NX(i), cy: NY, r: 40 }));
    g.appendChild(svg("text", { class: n.id.length > 3 ? "id long" : "id", x: NX(i), y: NY }, n.id));
    g.appendChild(svg("text", { class: "label", x: NX(i), y: NY + 82 }, n.label));
    const age = svg("text", { class: "age", x: NX(i), y: NY + 114 }, "never heard");
    g.appendChild(age);
    map.appendChild(g);
    nodeEls[n.id] = { g, age, i, until: 0 };
  });
}

function renderNodes(nodes) {
  const now = Date.now();
  for (const n of NODES) {
    const info = nodes[n.id] || {}, e = nodeEls[n.id];
    e.g.setAttribute("class", `node ${info.health || "grey"}${e.until > now ? " hl" : ""}`);
    e.age.textContent = info.age == null ? "never heard" : `heard ${ago(info.age)}`;
  }
  const others = Object.keys(nodes).filter((id) => !nodeEls[id]);
  $("others").textContent = others.length
    ? "Other nodes: " + others.map((id) => `${id} (${nodes[id].health})`).join(", ") : "";
}

// Pulse the nodes on the alert's path and draw arcs hop by hop (a skipped node shows as a bigger jump).
function highlightRoute(a) {
  const path = [a.src, ...(Array.isArray(a.rt) ? a.rt : [])];
  if (path[path.length - 1] !== "BASE") path.push("BASE");
  const hops = path.filter((id) => nodeEls[id]);
  const until = Date.now() + HIGHLIGHT_MS;
  for (const id of hops) { nodeEls[id].until = until; nodeEls[id].g.classList.add("hl"); }
  setTimeout(() => {
    for (const id of hops) if (nodeEls[id].until <= Date.now()) nodeEls[id].g.classList.remove("hl");
  }, HIGHLIGHT_MS + 50);
  for (let k = 0; k < hops.length - 1; k++) {
    const i1 = nodeEls[hops[k]].i, i2 = nodeEls[hops[k + 1]].i;
    if (i1 === i2) continue;
    const x1 = NX(i1), x2 = NX(i2), y = NY - 44, lift = 45 + 45 * (Math.abs(i2 - i1) - 1);
    const p = svg("path", { class: "arc", d: `M${x1} ${y} Q${(x1 + x2) / 2} ${y - 2 * lift} ${x2} ${y}` });
    p.style.stroke = `var(--${TYPE_CLASS[a.t] || "other"})`;
    $("arcs").appendChild(p);
    setTimeout(() => p.remove(), HIGHLIGHT_MS);
  }
}

// ---------- alert cards ----------
const deg = (dt) => (dt == null ? null : `${dt >= 0 ? "+" : ""}${dt} °C`);
const zone = (a) => (a.z ? `zone ${a.z}` : null);
function extras(a) {
  return Object.entries(a).filter(([k]) => !SHOWN_KEYS.has(k))
    .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`);
}

function describe(a) {
  switch (a.t) {
    case "SOS":
      return {
        main: a.msg ? `“${a.msg}”` : "SOS (no message)",
        details: [a.p != null ? (a.p >= 4 ? "4 or more people" : `${a.p} ${a.p === 1 ? "person" : "people"}`) : null,
                  a.inj != null ? el("span", a.inj > 0 ? "bad-t" : null, INJURY[a.inj] || `injury ${a.inj}`) : null,
                  a.src === "B1" ? "sent from the rescue Wi-Fi at B1" : null],
      };
    case "PERSON":
      return {
        main: `${a.ps === "D" ? "Person on the ground" : "Person detected"}${a.c != null ? ` · ${a.c}%` : ""}`,
        details: [a.ps === "D" ? el("span", "bad-t", "lying down, possible casualty") : a.ps === "U" ? "upright" : null,
                  a.th === 1 ? el("span", "yes", "thermal confirmed") : a.th === 0 ? el("span", "no", "thermal not confirmed") : null,
                  a.th != null ? deg(a.dt) : null, VIEW[a.v]],
      };
    case "PHONE": {
      const where = a.z || a.src;
      return {
        main: a.n != null ? `${a.n} device${a.n === 1 ? "" : "s"} near ${where}` : `Phones heard near ${where}`,
        details: [a.nr > 0 ? el("span", "near", `${a.nr === 1 ? "A phone is" : `${a.nr} phones are`} right next to ${where}`) : null,
                  a.rssi != null ? `strongest ${a.rssi} dBm` : null, a.ap != null ? `${a.ap} Apple` : null],
      };
    }
    case "HEAT":
      return {
        main: "Warm spot, no person seen",
        details: [deg(a.dt), VIEW[a.v], a.c != null ? `${a.c}% confidence` : null],
      };
    case "HAZARD":
      return { main: a.msg || "Hazard reported", details: extras(a) };
    default:
      return { main: `${a.t || "Unknown"} message${a.msg ? `: ${a.msg}` : ""}`, details: extras(a) };
  }
}

function buildCard(a, fresh) {
  const card = el("article", `card ${TYPE_CLASS[a.t] || "other"}${a.ps === "D" ? " down" : ""}${a.handled ? " handled" : ""}${a.acked ? " acked" : ""}${fresh ? " fresh" : ""}`);
  const top = el("div", "top");
  top.appendChild(el("span", "badge", a.t || "?"));
  if (zone(a)) top.appendChild(el("span", "zone-t", `Zone ${a.z}`));
  top.appendChild(el("span", "time", fmtTime(a.rx)));
  card.appendChild(top);

  const d = describe(a);
  card.appendChild(el("div", "main", d.main));
  const parts = d.details.filter(Boolean);
  if (parts.length) {
    const row = el("div", "details");
    parts.forEach((x, i) => {
      if (i) row.appendChild(document.createTextNode(" · "));
      row.appendChild(typeof x === "string" ? el("span", null, x) : x);
    });
    card.appendChild(row);
  }

  const meta = el("div", "meta");
  const route = [a.src, ...(Array.isArray(a.rt) ? a.rt : [])].filter(Boolean).join(" → ");
  const rssi = typeof a._rssi === "number" ? `  ·  ${a._rssi} dBm at base` : "";
  meta.appendChild(el("span", "route", `${route}${a.id ? `  ·  #${a.id}` : ""}${rssi}`));
  if (a.reps > 1) meta.appendChild(el("span", "reps", `×${a.reps} since ${fmtTime(a.first)}`));
  if (a.acked) {
    meta.appendChild(el("span", "acked-t", `Reply sent to survivor ${fmtTime(a.acked)}`));
  } else if (a.t === "SOS" && a.id && canSend) {
    const r = el("button", "reply", "Reply: help is on the way");
    r.onclick = () => sendAck(a.key, r);
    meta.appendChild(r);
  }
  if (a.acked) {
    /* reply sent = handled */
  } else if (a.handled) {
    meta.appendChild(el("span", null, "Handled"));
  } else {
    const b = el("button", null, "Mark handled");
    b.onclick = () => markHandled(a.key, b);
    meta.appendChild(b);
  }
  card.appendChild(meta);
  return card;
}

const cards = new Map();          // alert key -> { el, handled }
let knownKeys = null, lastOrder = "";

function renderFeed(alerts) {
  const fresh = [];
  if (knownKeys === null) {
    knownKeys = new Set(alerts.map((a) => a.key));       // first load: no beeps for old alerts
  } else {
    for (const a of alerts) if (!knownKeys.has(a.key)) { knownKeys.add(a.key); fresh.push(a); }
  }
  const live = new Set();
  for (const a of alerts) {
    live.add(a.key);
    const c = cards.get(a.key);
    const sig = `${a.handled}|${a.rx}|${a.acked || ""}|${canSend}`;
    if (!c || c.sig !== sig) {
      const node = buildCard(a, fresh.includes(a));
      if (c) c.el.replaceWith(node);
      if (c && c.rx !== a.rx) highlightRoute(a);          // a repeat folded into this card
      cards.set(a.key, { el: node, sig, rx: a.rx });
    }
  }
  for (const [k, c] of cards) if (!live.has(k)) { c.el.remove(); cards.delete(k); }
  const order = alerts.map((a) => a.key).join(",");
  if (order !== lastOrder) {
    lastOrder = order;
    const feed = $("feed");
    for (const a of alerts) feed.appendChild(cards.get(a.key).el);
  }
  $("empty").hidden = alerts.length > 0;

  for (const a of fresh) highlightRoute(a);
  if (fresh.some((a) => a.t === "SOS")) beep();
}

let canSend = false;
async function sendAck(key, btn) {
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const r = await fetch(`/api/ack/${encodeURIComponent(key)}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ msg: "Help is on the way" }),
    });
    if (!r.ok) { btn.disabled = false; btn.textContent = "Send failed, retry"; return; }
  } catch (e) { btn.disabled = false; btn.textContent = "Send failed, retry"; return; }
  refresh();
}

async function markHandled(key, btn) {
  btn.disabled = true;
  try { await fetch(`/api/handle/${encodeURIComponent(key)}`, { method: "POST" }); } catch (e) { /* next poll retries the view */ }
  refresh();
}

// ---------- top bar ----------
function renderCounts(alerts) {
  const counts = {};
  for (const a of alerts) if (!a.handled) counts[a.t] = (counts[a.t] || 0) + 1;
  const box = $("counts");
  box.textContent = "";
  for (const t of TYPE_ORDER) {
    const n = counts[t] || 0;
    const pill = el("span", `count ${TYPE_CLASS[t]}${n ? "" : " zero"}`, `${n} ${t}`);
    pill.style.setProperty("--c", `var(--${TYPE_CLASS[t]})`);
    box.appendChild(pill);
  }
}

function renderLink(s) {
  const p = $("link");
  if (s === null) { p.className = "bad"; p.textContent = "Dashboard server offline"; return; }
  const src = s.source || "";
  if (s.serial_connected) {
    if (src.startsWith("mock") || src.startsWith("replay")) { p.className = "info"; p.textContent = src.replace(/^./, (c) => c.toUpperCase()); }
    else if (src === "stdin") { p.className = "good"; p.textContent = "● Reading stdin"; }
    else if (src.startsWith("hub")) { p.className = "good"; p.textContent = `● Live · ${src.replace(/^hub /, "")} via board hub`; }
    else { p.className = "good"; p.textContent = `● Serial connected · ${src}`; }
  } else {
    p.className = "bad";
    p.textContent = `● Serial disconnected${src ? ` · ${src}` : ""}`;
  }
}

// ---------- sound (Web Audio, no files; browsers need one click first) ----------
let audioCtx = null;
const soundOn = () => !!audioCtx && audioCtx.state === "running";
function updateSoundBtn() {
  const b = $("sound");
  b.textContent = soundOn() ? "Sound on" : "Enable sound";
  b.classList.toggle("off", !soundOn());
}
function enableSound(test) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume().then(() => { updateSoundBtn(); if (test) beep(); });
  } catch (e) { /* no audio available */ }
}
function beep() {
  if (!soundOn()) return;
  const t0 = audioCtx.currentTime;
  [[880, 0], [660, 0.22], [880, 0.44], [660, 0.66]].forEach(([freq, dt]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + dt);
    o.stop(t0 + dt + 0.21);
  });
}
$("sound").onclick = () => enableSound(true);
document.addEventListener("pointerdown", () => enableSound(false));

// ---------- theme ----------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").textContent = t === "light" ? "Dark" : "Light";
  try { localStorage.setItem("rn-theme", t); } catch (e) { /* storage blocked */ }
}
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
try { setTheme(localStorage.getItem("rn-theme") || "dark"); } catch (e) { setTheme("dark"); }

// ---------- polling ----------
let lastOk = 0, busy = false;
function render(s) {
  canSend = !!s.can_send;
  renderLink(s);
  renderNodes(s.nodes);
  renderCounts(s.alerts);
  renderFeed(s.alerts);
  const st = s.stats || {};
  $("stats").textContent = `Messages ${st.received ?? 0} · duplicates dropped ${st.duplicates ?? 0} · non-JSON lines ignored ${st.ignored ?? 0}`;
}
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const s = await r.json();
    lastOk = Date.now();
    render(s);
  } catch (e) {
    if (Date.now() - lastOk > 3000) renderLink(null);
  } finally {
    busy = false;
  }
}
function tick() { $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); }

buildMap();
tick();
setInterval(tick, 1000);
refresh();
setInterval(refresh, 1000);

// ---- spotter live view: camera / thermal JPEGs and LiDAR outline sent over the bulk link ----
const remoteSeq = {};
function ageText(a) { return a == null ? "" : a < 1.5 ? "just now" : `${Math.round(a)} s ago`; }
function drawLidar(mm) {
  const c = $("rlidar"), g = c.getContext("2d"), W = c.width, H = c.height, C = H / 2, CX = W / 2;
  const css = getComputedStyle(document.documentElement);
  const pts = mm.map((d, i) => [i, d]).filter(([, d]) => d > 0);
  const far = pts.length ? Math.max(...pts.map(([, d]) => d)) : 6000;
  const maxM = Math.min(12, Math.max(3, Math.ceil(far / 1000)));
  const k = (C - 10) / (maxM * 1000);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.save(); g.translate(CX - C, 0);
  g.strokeStyle = "#333"; g.fillStyle = "#777"; g.font = "13px sans-serif"; g.lineWidth = 1;
  for (let r = 1; r <= maxM; r++) {
    g.beginPath(); g.arc(C, C, r * 1000 * k, 0, 2 * Math.PI); g.stroke();
    g.fillText(`${r} m`, C + 3, C - r * 1000 * k + 13);
  }
  g.fillStyle = css.getPropertyValue("--ok") || "#22c55e";
  for (const [deg, d] of pts) {
    const t = deg * Math.PI / 180;
    g.fillRect(C + Math.sin(t) * d * k - 2, C - Math.cos(t) * d * k - 2, 4, 4);
  }
  g.fillStyle = css.getPropertyValue("--warn") || "#f5a524";
  g.beginPath(); g.arc(C, C, 6, 0, 2 * Math.PI); g.fill();
  g.strokeStyle = g.fillStyle; g.lineWidth = 3; g.beginPath(); g.moveTo(C, C); g.lineTo(C, C - 22); g.stroke();
  g.restore();
}
async function refreshRemote() {
  let r;
  try { r = await (await fetch("/api/remote", { cache: "no-store" })).json(); } catch (e) { return; }
  for (const name of ["camera", "thermal"]) {
    const it = r[name], id = name === "camera" ? "rcam" : "rthermal";
    const label = name === "camera" ? "Camera" : "Thermal (bright = warm)";
    if (it.seq != null && it.seq !== remoteSeq[name]) { remoteSeq[name] = it.seq; $(id).src = `/api/remote/${name}.jpg?s=${it.seq}`; }
    const t = $(id + "-t");
    t.textContent = it.seq == null ? `${label}: waiting${it.partial ? ` (${it.partial} chunks)` : ""}`
      : `${label} · ${ageText(it.age)} · ${(it.bytes / 1024).toFixed(1)} KB`;
    t.classList.toggle("stale", it.age != null && it.age > 10);
  }
  const li = r.lidar, lt = $("rlidar-t");
  if (li.mm && li.seq !== remoteSeq.lidar) { remoteSeq.lidar = li.seq; drawLidar(li.mm); }
  lt.textContent = li.seq == null ? "LiDAR: waiting" : `LiDAR around the spotter (1 m rings) · ${ageText(li.age)}`;
  lt.classList.toggle("stale", li.age != null && li.age > 10);
  const lost = ["camera", "thermal", "lidar"].reduce((a, n) => a + r[n].lost, 0);
  const ok = ["camera", "thermal", "lidar"].reduce((a, n) => a + r[n].ok, 0);
  const m = r.meta || {}, LV = ["good", "fair", "poor"];
  const lvl = m.lvl == null ? "" : ` · link ${LV[m.lvl] || m.lvl}${m.rssi != null ? ` (${Math.round(m.rssi)} dBm)` : ""}${m.lvl > 0 ? ", pictures reduced to keep the map and people flowing" : ""}`;
  $("rstats").textContent = `Bulk link ${r.kbps} kbps · ${ok} objects received, ${lost} incomplete${lvl}`;
}
refreshRemote();
setInterval(refreshRemote, 300);

// ---- floor plan: SLAM map, spotter path, relays, people (all in metres, map frame from the dashboard) ----
const PLAN = { data: null, img: null, imgV: -1, view: null, drag: null, dragPos: null };
const CHAIN = ["B2", "B1", "BASE"];
const SRC_TEXT = { C: "camera", T: "thermal", CT: "camera + thermal" };
function planColors() {
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
  return { ok: v("--ok"), warn: v("--warn"), off: v("--off"), bad: v("--sos"), info: v("--info"), hazard: v("--hazard"), person: v("--person") };
}
function planBounds(d) {
  const xs = [], ys = [];
  const add = (x, y) => { if (x != null && y != null && isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); } };
  if (d.png) { add(d.png.x0, d.png.y0); add(d.png.x0 + d.png.w * d.png.res, d.png.y0 + d.png.h * d.png.res); }
  add(d.pose[0], d.pose[1]);
  for (const p of d.path) add(p[0], p[1]);
  for (const p of d.scan) add(p[0], p[1]);
  for (const n of Object.values(d.nodes)) add(n.x, n.y);
  for (const p of d.persons) add(p.x, p.y);
  let x0 = Math.min(...xs) - 1, x1 = Math.max(...xs) + 1, y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
  const minSpan = 8;
  if (x1 - x0 < minSpan) { const c = (x0 + x1) / 2; x0 = c - minSpan / 2; x1 = c + minSpan / 2; }
  if (y1 - y0 < minSpan) { const c = (y0 + y1) / 2; y0 = c - minSpan / 2; y1 = c + minSpan / 2; }
  const v = PLAN.view;                       // only grow, so the picture does not jump around while walking
  if (v && !PLAN.resetView) { x0 = Math.min(x0, v.x0); x1 = Math.max(x1, v.x1); y0 = Math.min(y0, v.y0); y1 = Math.max(y1, v.y1); }
  PLAN.resetView = false;
  return { x0, x1, y0, y1 };
}
function drawPlan() {
  const d = PLAN.data, c = $("plan");
  if (!d) return;
  const W = c.clientWidth, H = c.clientHeight, dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0d1014"; g.fillRect(0, 0, W, H);
  const b = PLAN.view = planBounds(d);
  const k = Math.min(W / (b.x1 - b.x0), H / (b.y1 - b.y0));
  const ox = W / 2 - k * (b.x0 + b.x1) / 2, oy = H / 2 + k * (b.y0 + b.y1) / 2;
  const sx = (x) => ox + k * x, sy = (y) => oy - k * y;
  PLAN.toMap = (px, py) => [(px - ox) / k, (oy - py) / k];
  PLAN.toScreen = (x, y) => [sx(x), sy(y)];
  const C = planColors();
  // 1 m grid
  g.strokeStyle = "#1a2027"; g.lineWidth = 1;
  for (let x = Math.ceil(b.x0); x <= b.x1; x++) { g.beginPath(); g.moveTo(sx(x), 0); g.lineTo(sx(x), H); g.stroke(); }
  for (let y = Math.ceil(b.y0); y <= b.y1; y++) { g.beginPath(); g.moveTo(0, sy(y)); g.lineTo(W, sy(y)); g.stroke(); }
  // SLAM occupancy map
  if (d.png && PLAN.img && PLAN.img.complete && PLAN.img.naturalWidth) {
    g.imageSmoothingEnabled = false;
    g.globalAlpha = 0.95;
    g.drawImage(PLAN.img, sx(d.png.x0), sy(d.png.y0 + d.png.h * d.png.res), d.png.w * d.png.res * k, d.png.h * d.png.res * k);
    g.globalAlpha = 1;
  }
  // live scan (grey when SLAM rejected it: tilted or poor match, not part of the map)
  g.fillStyle = d.scan_ok === false ? "#6b7280" : C.ok;
  for (const p of d.scan) g.fillRect(sx(p[0]) - 1.5, sy(p[1]) - 1.5, 3, 3);
  // walked path
  if (d.path.length > 1) {
    g.strokeStyle = C.info; g.lineWidth = 2; g.globalAlpha = 0.8; g.beginPath();
    d.path.forEach((p, i) => (i ? g.lineTo(sx(p[0]), sy(p[1])) : g.moveTo(sx(p[0]), sy(p[1]))));
    g.stroke(); g.globalAlpha = 1;
  }
  // relay chain links: spotter -> B2 -> B1 -> BASE (where positions are known)
  const pos = (id) => {
    if (PLAN.drag === id && PLAN.dragPos) return PLAN.dragPos;
    const n = d.nodes[id]; return n ? [n.x, n.y] : null;
  };
  const health = d.health || {};
  const hcol = (id) => ({ green: C.ok, amber: C.warn }[health[id]] || C.off);
  let prev = [d.pose[0], d.pose[1]];
  g.setLineDash([6, 8]); g.lineWidth = 3;
  for (const id of CHAIN) {
    const p = pos(id); if (!p) continue;
    g.strokeStyle = hcol(id); g.beginPath(); g.moveTo(sx(prev[0]), sy(prev[1])); g.lineTo(sx(p[0]), sy(p[1])); g.stroke();
    prev = p;
  }
  g.setLineDash([]);
  // suggested relay spots
  for (const r of d.relays || []) {
    g.strokeStyle = C.hazard; g.lineWidth = 3; g.setLineDash([4, 4]);
    g.beginPath(); g.arc(sx(r.x), sy(r.y), 14, 0, 2 * Math.PI); g.stroke(); g.setLineDash([]);
    planLabel(g, sx(r.x) + 18, sy(r.y), ["Drop a relay here", r.reason || ""], C.hazard);
  }
  // relay nodes
  for (const id of CHAIN) {
    const p = pos(id); if (!p) continue;
    g.fillStyle = hcol(id); g.beginPath(); g.arc(sx(p[0]), sy(p[1]), 15, 0, 2 * Math.PI); g.fill();
    g.fillStyle = "#0b0d10"; g.font = "bold 13px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(id, sx(p[0]), sy(p[1])); g.textAlign = "left"; g.textBaseline = "alphabetic";
  }
  // people
  for (const p of d.persons) {
    if (p.x == null) continue;
    const down = p.ps === "D", col = down ? C.bad : C.person, X = sx(p.x), Y = sy(p.y);
    g.fillStyle = col; g.beginPath(); g.arc(X, Y, 11, 0, 2 * Math.PI); g.fill();
    if (p.age < 3) { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.arc(X, Y, 18, 0, 2 * Math.PI); g.stroke(); }
    const l1 = `Person ${p.id}${down ? " DOWN" : p.ps === "U" ? " upright" : ""}`;
    const l2 = `${SRC_TEXT[p.src] || p.src || ""}${p.r ? ` · ${(+p.r).toFixed(1)} m${p.rs === "S" ? " (est.)" : ""}` : ""} · ${ageText(p.age)}`;
    planLabel(g, X + 16, Y, [l1, l2], col);
  }
  // spotter (handheld Pi + SP1)
  const [px, py, th] = d.pose, X = sx(px), Y = sy(py);
  const phi = Math.PI / 2 - th;              // th is clockwise from +y; canvas math wants counter-clockwise from +x
  const ang = (a) => [X + Math.cos(phi + a) * 16, Y - Math.sin(phi + a) * 16];
  g.fillStyle = C.warn; g.beginPath();
  const tip = ang(0), l = ang(2.5), r = ang(-2.5);
  g.moveTo(tip[0], tip[1]); g.lineTo(l[0], l[1]); g.lineTo(r[0], r[1]); g.closePath(); g.fill();
  planLabel(g, X + 16, Y + 22, ["Spotter"], C.warn);
  // scale bar
  const m = k >= 60 ? 1 : k >= 25 ? 2 : 5;
  g.strokeStyle = "#cfd6dd"; g.lineWidth = 3; g.beginPath(); g.moveTo(16, H - 16); g.lineTo(16 + m * k, H - 16); g.stroke();
  g.fillStyle = "#cfd6dd"; g.font = "13px sans-serif"; g.fillText(`${m} m`, 16, H - 22);
}
function planLabel(g, x, y, lines, col) {
  lines = lines.filter(Boolean);
  g.font = "bold 14px sans-serif";
  const w = Math.max(...lines.map((t) => g.measureText(t).width)) + 12, h = lines.length * 18 + 6;
  g.fillStyle = "rgba(0,0,0,0.72)"; g.fillRect(x, y - h / 2, w, h);
  g.fillStyle = col; g.fillRect(x, y - h / 2, 3, h);
  g.fillStyle = "#f4f6f8";
  lines.forEach((t, i) => { g.font = i ? "13px sans-serif" : "bold 14px sans-serif"; g.fillText(t, x + 8, y - h / 2 + 17 + i * 18); });
}
async function refreshPlan() {
  let d;
  try { d = await (await fetch("/api/map", { cache: "no-store" })).json(); } catch (e) { return; }
  PLAN.data = d;
  if (d.png && d.png.v !== PLAN.imgV) {
    PLAN.imgV = d.png.v;
    const img = new Image(); img.onload = () => { PLAN.img = img; drawPlan(); }; img.src = `/api/map.png?v=${d.png.v}`;
  }
  const people = d.persons.length, down = d.persons.filter((p) => p.ps === "D").length;
  const slam = d.slam ? `SLAM ${d.scans} scans${d.rejected ? `, ${d.rejected} rejected (tilt or poor match)` : ""}` : "live scan only (SLAM not loaded)";
  $("plan-t").textContent = d.scan_age == null ? "waiting for LiDAR"
    : `${slam} · ${d.hz} Hz · ${people} ${people === 1 ? "person" : "people"}${down ? ` (${down} down)` : ""}${d.scan_ok === false ? ` · last scan skipped (${d.reject_reason})` : ""}${d.slam_error ? " · " + d.slam_error : ""}`;
  drawPlan();
}
async function planPost(url, body) {
  try { await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); } catch (e) { /* next poll shows the truth */ }
  refreshPlan();
}
document.querySelectorAll("#plan-tools button[data-node]").forEach((b) => b.addEventListener("click", () => planPost(`/api/map/node/${b.dataset.node}`, { here: true })));
$("plan-reset").addEventListener("click", () => { if (confirm("Start a new map? Relay positions are kept.")) { PLAN.resetView = true; PLAN.view = null; planPost("/api/map/reset"); } });
$("plan").addEventListener("pointerdown", (e) => {
  const d = PLAN.data; if (!d || !PLAN.toScreen) return;
  const r = $("plan").getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (const id of CHAIN) {
    const n = d.nodes[id]; if (!n) continue;
    const [X, Y] = PLAN.toScreen(n.x, n.y);
    if (Math.hypot(X - x, Y - y) < 20) { PLAN.drag = id; PLAN.dragPos = [n.x, n.y]; $("plan").setPointerCapture(e.pointerId); return; }
  }
});
$("plan").addEventListener("pointermove", (e) => {
  if (!PLAN.drag) return;
  const r = $("plan").getBoundingClientRect();
  PLAN.dragPos = PLAN.toMap(e.clientX - r.left, e.clientY - r.top); drawPlan();
});
$("plan").addEventListener("pointerup", () => {
  if (!PLAN.drag) return;
  const id = PLAN.drag, [x, y] = PLAN.dragPos; PLAN.drag = null;
  planPost(`/api/map/node/${id}`, { x, y });
});
window.addEventListener("resize", drawPlan);
refreshPlan();
setInterval(refreshPlan, 500);
</script>
